# Phase 2: every change on the phase-2 branch is tested against Firebase's local
# emulators. If the tests pass and the deploy key is set up, the app and its
# database rules are published to Firebase (herding-cats-1e399).
name: Phase 2 test and publish

on:
  push:
    branches: [phase-2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-2
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund firebase-tools@13 playwright@1.47 firebase@10.14.1
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check the code
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Run rule and screen tests on the emulators
        run: npx firebase emulators:exec --project demo-herding-cats --only auth,firestore,hosting "node tests/rules.mjs && node tests/e2e.mjs"

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/phase-2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check for the deploy key
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "::notice::No deploy key yet (secret FIREBASE_SERVICE_ACCOUNT). Tests passed; nothing published."; fi
      - name: Publish app and rules to Firebase
        if: steps.key.outputs.ready == 'yes'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project herding-cats-1e399 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
